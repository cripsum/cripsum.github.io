<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0b">
    <title>Cripsum™ — Manutenzione</title>
    <link rel="icon" href="/img/Susremaster.png" type="image/png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0a0b;
            --surface: #161617;
            --surface-2: #1f1f21;
            --line: #2a2a2d;
            --text: #f5f5f7;
            --text-2: #a1a1a6;
            --text-3: #6e6e73;
            --warn: #ffb020;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--text);
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .mn {
            width: 100%;
            max-width: 34rem;
            animation: mn-in 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes mn-in {
            from { opacity: 0; transform: translateY(10px); }
        }

        .mn-logo {
            display: block;
            width: 3.5rem;
            height: 3.5rem;
            margin-bottom: 1.75rem;
            border-radius: 14px;
            object-fit: cover;
        }

        /* Lo stato: l'unico colore della pagina, e dice una cosa sola. */
        .mn-state {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin: 0 0 0.9rem;
            color: var(--text-2);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .mn-dot {
            position: relative;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: var(--warn);
        }

        .mn-dot::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--warn);
            animation: mn-pulse 2.2s ease-out infinite;
        }

        @keyframes mn-pulse {
            from { opacity: 0.7; transform: scale(1); }
            to { opacity: 0; transform: scale(3.2); }
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 9vw, 3.5rem);
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .mn-lead {
            margin: 1rem 0 0;
            color: var(--text-2);
        }

        .mn-reason {
            margin: 1.75rem 0 0;
            padding: 1.1rem 1.25rem;
            border-radius: 20px;
            background: var(--surface);
        }

        .mn-reason h2,
        .mn-facts dt {
            margin: 0;
            color: var(--text-2);
            font-size: 0.8125rem;
            font-weight: 400;
        }

        .mn-reason p {
            margin: 0.3rem 0 0;
            overflow-wrap: anywhere;
        }

        .mn-facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
            gap: 0.75rem;
            margin: 0.75rem 0 0;
        }

        .mn-facts div {
            padding: 0.9rem 1.25rem;
            border-radius: 20px;
            background: var(--surface);
        }

        .mn-facts dd {
            margin: 0.15rem 0 0;
            font-weight: 500;
        }

        .mn-facts small {
            display: block;
            color: var(--text-2);
            font-size: 0.8125rem;
            font-weight: 400;
        }

        .mn-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.75rem;
        }

        .mn-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 2.9rem;
            padding: 0 1.4rem;
            border: 1px solid var(--line);
            border-radius: 980px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 0.9375rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 160ms ease, background-color 160ms ease;
        }

        .mn-btn:hover { border-color: var(--text-3); }

        .mn-btn--main {
            border-color: transparent;
            background: var(--text);
            color: #000;
        }

        .mn-btn--main:hover {
            border-color: transparent;
            background: #fff;
        }

        .mn-btn[disabled] {
            opacity: 0.6;
            cursor: default;
        }

        .mn-btn:focus-visible,
        .mn-foot a:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 2px;
        }

        .mn-auto {
            margin: 1.25rem 0 0;
            color: var(--text-3);
            font-size: 0.8125rem;
        }

        .mn-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem 1rem;
            margin-top: 2.5rem;
            padding-top: 1.1rem;
            border-top: 1px solid var(--line);
            color: var(--text-3);
            font-size: 0.8125rem;
        }

        .mn-foot a {
            color: var(--text-2);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .mn-foot a:hover { color: var(--text); }

        @media (max-width: 30rem) {
            .mn-actions { flex-direction: column; }
            .mn-btn { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .mn,
            .mn-dot::after { animation: none; }
            .mn-btn { transition: none; }
        }
    </style>
</head>
<body>
    <main class="mn">
        <img class="mn-logo" src="/img/amongus-logo.jpg" alt="Cripsum™" width="56" height="56">

        <p class="mn-state"><span class="mn-dot" aria-hidden="true"></span><span data-k="state">Manutenzione in corso</span></p>
        <h1 data-k="title">Torniamo tra poco.</h1>
        <p class="mn-lead" data-k="lead">Il sito è chiuso per manutenzione. Torneremo il prima possibile.</p>

        
        
        <div class="mn-actions">
            <button type="button" class="mn-btn mn-btn--main" data-mn-retry data-k="retry">Riprova adesso</button>
            <a class="mn-btn" href="https://discord.gg/XdheJHVURw" target="_blank" rel="noopener" data-k="discord">Vieni su Discord</a>
        </div>

        <p class="mn-auto" aria-live="polite">
            <span data-k="auto">Questa pagina si riapre da sola: controlla ogni mezzo minuto.</span>
            <span data-k="checked">Ultimo controllo</span>: <span data-mn-checked data-k="checked_now">adesso</span>.
        </p>

        <footer class="mn-foot">
                        <span>Cripsum™</span>
        </footer>
    </main>

    <script>
        (() => {
            let copy = {"checked_now":"adesso","checking":"sto controllando…","in":"tra %s","late":"a momenti","h":"h","min":"min"};
                        // La pagina ferma non sa in che lingua e' il visitatore: lo decide qui,
            // dall'indirizzo e poi dal browser, come faceva la versione di prima.
            const english = {"page_title":"Cripsum™ — Maintenance","state":"Maintenance in progress","title":"Back in a bit.","lead":"The site is closed for maintenance. We will be back soon.","reason":"What we are doing","since":"Closed since","until":"Expected back","until_open":"as soon as we are done","retry":"Try again now","discord":"Join us on Discord","auto":"This page reopens on its own: it checks every half minute.","checked":"Last check","checked_now":"just now","checking":"checking…","staff":"Staff? Sign in","logged":"Signed in as %s","logout":"Sign out","today":"today at %s","yesterday":"yesterday at %s","tomorrow":"tomorrow around %s","today_around":"today around %s","on":"%s at %s","on_around":"%s around %s","in":"in %s","late":"any minute now","h":"h","min":"min"};
            const first = location.pathname.split('/').filter(Boolean)[0];
            const browser = (navigator.language || '').toLowerCase();
            if (first === 'en' || (first !== 'it' && browser.startsWith('en'))) {
                copy = english;
                document.documentElement.lang = 'en';
                document.title = english.page_title;
                document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = english[el.dataset.k]; });
            }
            
            const preview = false;
            const checked = document.querySelector('[data-mn-checked]');
            const retry = document.querySelector('[data-mn-retry]');
            let busy = false;

            // Si richiede questa stessa pagina: finche' il sito e' chiuso risponde 503.
            const check = async (manual) => {
                // Nell'anteprima del pannello la pagina risponde sempre 200: ricaricherebbe a vuoto.
                if (busy || preview) return;
                busy = true;
                if (manual) retry.disabled = true;
                checked.textContent = copy.checking;
                try {
                    const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' });
                    if (res.status !== 503) {
                        location.reload();
                        return;
                    }
                } catch (error) {
                    // Senza rete non si sa niente: si riprova al prossimo giro.
                }
                checked.textContent = copy.checked_now;
                retry.disabled = false;
                busy = false;
            };

            retry.addEventListener('click', () => check(true));
            setInterval(() => { if (!document.hidden) check(false); }, 30000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) check(false); });

            // «tra 1 h 20 min» accanto all'ora prevista, aggiornato ogni mezzo minuto.
            const left = document.querySelector('[data-mn-left]');
            if (left) {
                const skew = Number(left.dataset.now) * 1000 - Date.now();
                const tick = () => {
                    const minutes = Math.round((Number(left.dataset.until) * 1000 - (Date.now() + skew)) / 60000);
                    if (minutes <= 0) { left.textContent = copy.late; return; }
                    const hours = Math.floor(minutes / 60);
                    const text = (hours ? hours + ' ' + copy.h + ' ' : '') + (minutes % 60 || !hours ? (minutes % 60) + ' ' + copy.min : '');
                    left.textContent = copy.in.replace('%s', text.trim());
                };
                tick();
                setInterval(tick, 30000);
            }
        })();
    </script>
</body>
</html>
